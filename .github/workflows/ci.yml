name: JagdiSu CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Test backend
        working-directory: backend
        run: mvn test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  containers:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build backend image
        run: docker build -t ghcr.io/${{ github.repository_owner }}/jagdisu-backend:${{ github.sha }} backend
      - name: Build frontend image
        run: docker build -t ghcr.io/${{ github.repository_owner }}/jagdisu-frontend:${{ github.sha }} frontend
      - name: Push images
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/jagdisu-backend:${{ github.sha }}
          docker push ghcr.io/${{ github.repository_owner }}/jagdisu-frontend:${{ github.sha }}

  load-test-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: grafana/setup-k6-action@v1
      - name: Validate k6 smoke script
        run: k6 inspect infra/load/k6-smoke.js
      - name: Validate k6 auth script
        run: k6 inspect infra/load/k6-auth-flow.js
