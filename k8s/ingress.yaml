apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jagdisu
  namespace: jagdisu
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "25m"
    nginx.ingress.kubernetes.io/rate-limit: "120"
spec:
  ingressClassName: nginx
  rules:
    - host: jagdisu.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: jagdisu-backend
                port:
                  number: 2000
          - path: /actuator
            pathType: Prefix
            backend:
              service:
                name: jagdisu-backend
                port:
                  number: 2000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jagdisu-frontend
                port:
                  number: 80
