apiVersion: apps/v1
kind: Deployment
metadata:
  name: jagdisu-frontend
  namespace: jagdisu
spec:
  replicas: 2
  selector:
    matchLabels:
      app: jagdisu-frontend
  template:
    metadata:
      labels:
        app: jagdisu-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/your-org/jagdisu-frontend:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: jagdisu-frontend
  namespace: jagdisu
spec:
  selector:
    app: jagdisu-frontend
  ports:
    - port: 80
      targetPort: 80
