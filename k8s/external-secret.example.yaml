apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: jagdisu-secrets
  namespace: jagdisu
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: production-secret-store
    kind: ClusterSecretStore
  target:
    name: jagdisu-secrets
    creationPolicy: Owner
  data:
    - secretKey: DB_PASSWORD
      remoteRef:
        key: jagdisu/prod/db-password
    - secretKey: JWT_SECRET
      remoteRef:
        key: jagdisu/prod/jwt-secret
    - secretKey: OPENROUTER_API_KEY
      remoteRef:
        key: jagdisu/prod/openrouter-api-key
    - secretKey: RAZORPAY_KEY_SECRET
      remoteRef:
        key: jagdisu/prod/razorpay-key-secret
    - secretKey: SMTP_PASSWORD
      remoteRef:
        key: jagdisu/prod/smtp-password
